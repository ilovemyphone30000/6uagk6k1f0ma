<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonah Bierman</title>
<meta name="description" content="Jonah Bierman — music, management, iLoveMyPhone, graphic design.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --pink: #ffd6fb;
    --small: clamp(9px, 0.72vw, 11px);
    --nav: clamp(11px, 0.9vw, 13px);
    --pad: clamp(16px, 2.5vw, 36px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: "Helvetica Neue", Helvetica, Inter, -apple-system, system-ui, sans-serif;
    font-size: var(--nav);
    line-height: 1.15;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--pink); color: var(--ink); }
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  a:hover, .poster:hover figcaption { background: var(--pink); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .ext::after { content: " ↗"; }
  .caps { text-transform: uppercase; font-size: var(--small); }

  /* ---------- front page ---------- */
  #home {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: var(--pad);
  }
  .who { display: flex; flex-direction: column; gap: 4px; font-weight: 700; text-transform: uppercase; text-align: center; }
  .clock { font-variant-numeric: tabular-nums; }
  .lines { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .lines .note { color: #6b6b6b; }
  .mail { text-align: center; }

  /* ---------- inner pages ---------- */
  header {
    display: flex;
    justify-content: space-between;
    padding: var(--pad) 16% clamp(48px, 7vw, 90px);
  }
  header a:first-child { font-weight: 700; text-transform: uppercase; text-decoration: none; }
  main { flex: 1; padding: 0 var(--pad) clamp(80px, 10vw, 140px); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 26px; }

  /* portfolio */
  .work {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(14px, 2vw, 28px);
    width: min(980px, 100%);
    list-style: none;
  }
  .poster { display: block; width: 100%; text-align: left; }
  .poster img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #f2f2f2; margin-bottom: 6px; }
  .poster figcaption { line-height: 1.15; display: inline; }

  /* lightbox */
  dialog {
    border: 0;
    padding: var(--pad);
    max-width: 100vw;
    max-height: 100vh;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.96);
  }
  dialog[open] { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  dialog::backdrop { background: transparent; }
  dialog img { max-width: 100%; max-height: calc(100vh - 2 * var(--pad) - 30px); object-fit: contain; }

  @media (max-width: 760px) { .work { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { header { padding: var(--pad) var(--pad) 32px; } }
</style>
</head>
<body>

<section id="home">
  <div class="who">
    <p>Jonah Bierman</p>
    <p class="clock" id="clock">00:00:00AM</p>
  </div>
  <ul class="lines">
    <li>Music: <a class="ext" href="https://www.instagram.com/new__virginia/" target="_blank" rel="noopener">New Virginia</a></li>
    <li>Management clients:
      <a class="ext" href="https://www.instagram.com/azelrashaad/" target="_blank" rel="noopener">azel rm</a>,
      <a class="ext" href="https://www.instagram.com/piperquinceyjackson/" target="_blank" rel="noopener">Piper Quincey Jackson</a></li>
    <li><a href="#/ilovemyphone">iLoveMyPhone</a> <span class="note">(promotion/blog)</span></li>
    <li>Graphic design: <a href="#/portfolio">Portfolio</a></li>
  </ul>
  <p class="mail"><a href="mailto:jonah@paperweight.nyc">jonah@paperweight.nyc</a></p>
</section>

<header id="top" hidden>
  <a href="#/">Jonah Bierman</a>
  <span id="where"></span>
</header>

<main id="pages" hidden>
  <section class="tab" id="portfolio" hidden>
    <ul class="work" id="work"></ul>
  </section>

  <section class="tab" id="ilovemyphone" hidden>
    <div class="row caps">
      <a class="ext" href="https://www.instagram.com/ilovemyphone2005/" target="_blank" rel="noopener">Instagram</a>
      <a class="ext" href="https://open.spotify.com/user/31o2dxww5xg6yse2oa6fy5e6ffmy" target="_blank" rel="noopener">Spotify</a>
    </div>
  </section>
</main>

<dialog id="lb" aria-label="Poster">
  <img id="lbImg" alt="">
  <span class="caps" id="lbCap"></span>
</dialog>

<script>
  const WORK = [
    { src: "work/mavi.jpg", title: "Mavi — NYU Program Board" },
    { src: "work/sydney-sherrill-europe.jpg", title: "Sydney Sherrill — Europe Tour" },
    { src: "work/true-jackson-sxsw.jpg", title: "True Jackson — SXSW" },
    { src: "work/relics-clay-st.jpg", title: "Relics + Clay St — Nightclub 101" },
    { src: "work/relics-world-tour.jpg", title: "Relics — World Tour 2026" },
    { src: "work/new-virginia-house-show.jpg", title: "New Virginia — House Show" },
    { src: "work/avenues-for-justice.jpg", title: "Avenues for Justice Benefit" },
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);

  $("work").innerHTML = WORK.map((w, i) =>
    `<li><button type="button" class="poster" data-i="${i}"><figure>` +
    `<img src="${esc(w.src)}" alt="${esc(w.title)} poster" loading="lazy">` +
    `<figcaption class="caps">${esc(w.title)}</figcaption></figure></button></li>`).join("");

  // ---- lightbox ----
  const lb = $("lb");
  $("work").addEventListener("click", e => {
    const b = e.target.closest(".poster");
    if (!b) return;
    const w = WORK[b.dataset.i];
    $("lbImg").src = w.src;
    $("lbImg").alt = w.title + " poster";
    $("lbCap").textContent = w.title;
    lb.showModal();
  });
  lb.addEventListener("click", () => lb.close());

  // ---- pages: #/portfolio, #/ilovemyphone ----
  const PAGES = { portfolio: "Graphic Design — Portfolio", ilovemyphone: "iLoveMyPhone" };
  function route() {
    const key = location.hash.replace(/^#\/?/, "").replace(/\/$/, "");
    const label = PAGES[key];
    $("home").hidden = !!label;
    $("top").hidden = $("pages").hidden = !label;
    document.querySelectorAll(".tab").forEach(t => (t.hidden = t.id !== key));
    $("where").textContent = label || "";
    document.title = label ? `${label} — Jonah Bierman` : "Jonah Bierman";
    scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  route();

  // ---- live clock, New York time ----
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true,
  });
  const clock = $("clock");
  let last = "";
  (function tick() {
    const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x => [x.type, x.value]));
    const s = `${p.hour}:${p.minute}:${p.second}${p.dayPeriod.toUpperCase()}`;
    if (s !== last) clock.textContent = last = s;
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
