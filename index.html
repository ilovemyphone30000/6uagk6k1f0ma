<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonah Bierman</title>
<meta name="description" content="Jonah Bierman — management, music, graphic design, iLoveMyPhone.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --pink: #ffd6fb;
    --rule: #cfcfcf;
    --small: clamp(9px, 0.72vw, 11px);
    --nav: clamp(11px, 0.9vw, 13px);
    --pad: clamp(16px, 2.5vw, 36px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: "Helvetica Neue", Helvetica, Inter, -apple-system, system-ui, sans-serif;
    font-size: var(--nav);
    line-height: 1.15;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--pink); color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  a:hover, .poster:hover figcaption, .kids button:hover { background: var(--pink); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  .ext::after { content: " ↗"; }
  .caps { text-transform: uppercase; font-size: var(--small); }
  .u { text-decoration: underline; text-underline-offset: 2px; }

  /* ---------- hover pictures: hands behind everything for iLove, faded polaroid for the name ---------- */
  .shell { position: relative; z-index: 1; }
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #fff url("img/ilove-hands.jpg") center / cover no-repeat;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .me {
    position: fixed;
    z-index: 0;
    left: 58%;
    top: 16vh;
    width: min(28vw, 380px);
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  body.show-hands .bg { opacity: 1; }
  body.show-me .me { opacity: 0.35; }
  @media (prefers-reduced-motion: reduce) { .bg, .me { transition: none; } }

  /* ---------- the tree: name, clock, headings (current one opens), email ---------- */
  .side { display: flex; flex-direction: column; gap: 40px; font-size: clamp(13px, 1.05vw, 15px); }
  .side .caps { font-size: clamp(10px, 0.8vw, 12px); }
  .who { display: flex; flex-direction: column; gap: 4px; font-weight: 700; text-transform: uppercase; }
  .clock { font-variant-numeric: tabular-nums; }
  .tree { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .tree > li > a[aria-current="page"] { text-decoration: underline; text-underline-offset: 2px; }
  .kids {
    list-style: none;
    margin: 6px 0 4px 3px;
    padding-left: 12px;
    border-left: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tree > li:not(.open) > .kids { display: none; }

  /* ---------- content ---------- */
  .tab { display: flex; flex-direction: column; gap: 28px; }
  .list { list-style: none; line-height: 1.1; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 26px; }
  .work {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(14px, 2vw, 28px);
    width: min(980px, 100%);
    list-style: none;
  }
  .poster { display: block; width: 100%; }
  .poster img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #f2f2f2; margin-bottom: 6px; }
  .poster figcaption { line-height: 1.15; display: inline; }
  .press { width: min(420px, 100%); }
  .press blockquote { font-size: var(--nav); line-height: 1.3; margin: 0 0 8px; text-transform: none; }
  .press cite { font-style: normal; }

  /* lightbox */
  dialog {
    border: 0;
    padding: var(--pad);
    max-width: 100vw;
    max-height: 100vh;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.96);
  }
  dialog[open] { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  dialog::backdrop { background: transparent; }
  dialog img { max-width: 100%; max-height: calc(100vh - 2 * var(--pad) - 30px); object-fit: contain; }

  /* ---------- laptop: tree stays on the left, content opens to the right ---------- */
  @media (min-width: 900px) {
    .shell {
      display: grid;
      grid-template-columns: clamp(220px, 22vw, 300px) 1fr;
      min-height: 100vh;
    }
    .side {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      padding: calc(var(--pad) + 8px) var(--pad);
      border-right: 1px solid var(--rule);
    }
    .side .mail { margin-top: auto; }
    main { padding: calc(var(--pad) + 8px) var(--pad) clamp(60px, 8vw, 120px); }
    #top { display: none !important; }
    .work { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  }

  /* ---------- phone: first page centred, each heading its own page ---------- */
  @media (max-width: 899px) {
    .side { min-height: 100vh; align-items: center; justify-content: center; text-align: center; padding: var(--pad); }
    .kids { display: none !important; }
    body.inside .side { display: none; }
    body:not(.inside) main, body:not(.inside) #top { display: none; }
    #top { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: var(--pad) var(--pad) 32px; }
    #top a:first-child { flex-basis: 100%; font-weight: 700; text-transform: uppercase; }
    #top a[aria-current="page"] { text-decoration: underline; text-underline-offset: 2px; }
    main { padding: 0 var(--pad) 80px; }
    .tab { align-items: center; text-align: center; }
    .row { justify-content: center; }
    .work { grid-template-columns: repeat(2, 1fr); text-align: left; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<img class="me" src="img/jonah-polaroid.jpg" alt="" aria-hidden="true">

<div class="shell">
  <aside class="side">
    <a class="who" href="#/">
      <span>Jonah Bierman</span>
      <span class="clock" id="clock">00:00:00AM</span>
    </a>
    <ul class="tree" id="tree"></ul>
    <a class="mail" href="mailto:jonah@paperweight.nyc">jonah@paperweight.nyc</a>
  </aside>

  <div>
    <header id="top">
      <a href="#/">Jonah Bierman</a>
      <a href="#/management">Management</a>
      <a href="#/music">Music</a>
      <a href="#/design">Graphic Design</a>
      <a href="#/ilovemyphone">iLoveMyPhone</a>
    </header>

    <main>
      <section class="tab" id="management" hidden>
        <p class="caps u">Current</p>
        <ul class="list caps" id="mgmt"></ul>
      </section>

      <section class="tab" id="music" hidden>
        <ul class="list caps" id="musicList"></ul>
      </section>

      <section class="tab" id="design" hidden>
        <ul class="work" id="work"></ul>
      </section>

      <section class="tab" id="ilovemyphone" hidden>
        <div class="row caps" id="iloveLinks"></div>
      </section>

      <!-- Press is hidden for now: nothing links here. To bring it back, add it to TREE. -->
      <section class="tab" id="press" hidden>
        <div class="press caps">
          <blockquote>“His branding and management are really chic”</blockquote>
          <cite>— NYU ’26 student, asked whose career they envy.
            <a class="ext u" href="https://www.readfeedme.com/p/hows-the-job-hunt-going-for-the-class" target="_blank" rel="noopener">Feed Me, Jan 2026</a></cite>
        </div>
      </section>
    </main>
  </div>
</div>

<dialog id="lb" aria-label="Poster">
  <img id="lbImg" alt="">
  <span class="caps" id="lbCap"></span>
</dialog>

<script>
  // ---- content: edit here ----
  const MANAGEMENT = ["Azel RM", "Piper Quincey Jackson"];

  const MUSIC = [["New Virginia", "https://www.instagram.com/new__virginia/"]];

  const ILOVE = [
    ["Instagram", "https://www.instagram.com/ilovemyphone2005/"],
    ["Spotify", "https://open.spotify.com/user/31o2dxww5xg6yse2oa6fy5e6ffmy"],
  ];

  const WORK = [
    { src: "work/mavi.jpg", title: "Mavi — NYU Program Board" },
    { src: "work/sydney-sherrill-europe.jpg", title: "Sydney Sherrill — Europe Tour" },
    { src: "work/true-jackson-sxsw.jpg", title: "True Jackson — SXSW" },
    { src: "work/relics-clay-st.jpg", title: "Relics + Clay St — Nightclub 101" },
    { src: "work/relics-world-tour.jpg", title: "Relics — World Tour 2026" },
    { src: "work/new-virginia-house-show.jpg", title: "New Virginia — House Show" },
    { src: "work/avenues-for-justice.jpg", title: "Avenues for Justice Benefit" },
  ];

  // ---- render ----
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);
  const out = ([label, href]) => `<a class="ext" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`;

  $("mgmt").innerHTML = MANAGEMENT.map(n => `<li>${esc(n)}</li>`).join("");
  $("musicList").innerHTML = MUSIC.map(m => `<li>${out(m)}</li>`).join("");
  $("iloveLinks").innerHTML = ILOVE.map(out).join("");
  $("work").innerHTML = WORK.map((w, i) =>
    `<li><button type="button" class="poster" data-i="${i}"><figure>` +
    `<img src="${esc(w.src)}" alt="${esc(w.title)} poster" loading="lazy">` +
    `<figcaption class="caps">${esc(w.title)}</figcaption></figure></button></li>`).join("");

  // tree: each heading, with what sits under it
  const TREE = [
    ["management", "Management", MANAGEMENT.map(n => `<li class="caps">${esc(n)}</li>`)],
    ["music", "Music", MUSIC.map(m => `<li class="caps">${out(m)}</li>`)],
    ["design", "Graphic Design", []],
    ["ilovemyphone", "iLoveMyPhone", ILOVE.map(l => `<li class="caps">${out(l)}</li>`)],
  ];
  $("tree").innerHTML = TREE.map(([id, label, kids]) =>
    `<li data-id="${id}"><a href="#/${id}">${esc(label)}</a>` +
    (kids.length ? `<ul class="kids">${kids.join("")}</ul>` : "") + `</li>`).join("");

  // ---- lightbox (from the grid or from a poster name in the tree) ----
  const lb = $("lb");
  function openPoster(i) {
    const w = WORK[i];
    $("lbImg").src = w.src;
    $("lbImg").alt = w.title + " poster";
    $("lbCap").textContent = w.title;
    lb.showModal();
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-i]");
    if (b) openPoster(b.dataset.i);
  });
  lb.addEventListener("click", () => lb.close());

  // ---- routing ----
  const LABELS = Object.fromEntries(TREE.map(([id, label]) => [id, label]));
  let current = "";
  const showTab = key => document.querySelectorAll(".tab").forEach(t => (t.hidden = t.id !== key));
  function route() {
    const key = location.hash.replace(/^#\/?/, "").replace(/\/$/, "");
    const label = LABELS[key];
    current = label ? key : "";
    document.body.classList.toggle("inside", !!label);
    showTab(current);
    document.querySelectorAll("#tree > li").forEach(li => {
      const on = li.dataset.id === key;
      li.classList.toggle("open", on);
      on ? li.firstChild.setAttribute("aria-current", "page") : li.firstChild.removeAttribute("aria-current");
    });
    document.querySelectorAll("#top a").forEach(a =>
      a.getAttribute("href") === "#/" + key ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    document.title = label ? `${label} — Jonah Bierman` : "Jonah Bierman";
    if (matchMedia("(max-width: 899px)").matches) scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  route();

  // ---- laptop hover: a heading previews its page; iLove brings up the hands; the name brings up the polaroid ----
  const canHover = matchMedia("(min-width: 900px) and (hover: hover)");
  $("tree").addEventListener("mouseover", e => {
    if (!canHover.matches) return;
    const li = e.target.closest("#tree > li");
    if (!li) return;
    showTab(li.dataset.id);
    document.body.classList.toggle("show-hands", li.dataset.id === "ilovemyphone");
  });
  $("tree").addEventListener("mouseleave", () => {
    showTab(current);
    document.body.classList.remove("show-hands");
  });
  const who = document.querySelector(".who");
  who.addEventListener("mouseenter", () => canHover.matches && document.body.classList.add("show-me"));
  who.addEventListener("mouseleave", () => document.body.classList.remove("show-me"));

  // ---- live clock, New York time: HH:MM:SSPM ----
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true,
  });
  const clock = $("clock");
  let last = "";
  (function tick() {
    const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x => [x.type, x.value]));
    const s = `${p.hour}:${p.minute}:${p.second}${p.dayPeriod.toUpperCase()}`;
    if (s !== last) clock.textContent = last = s;
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
